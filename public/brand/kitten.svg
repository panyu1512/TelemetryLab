<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TelemetryLab">
  <!--
    The TelemetryLab mark (1.30+): a black kitten's head, drawn anime-style —
    tall pointed ears with a warm inner ear, big hornet-yellow eyes with slit
    pupils and two catch-lights, a small pink nose, a "w" mouth and whiskers.
    Bare form, for dark ground: the head carries a 2.2 hornet-yellow rim so the
    black fur reads against black. See design.md § The mark (v2).
  -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- head + ears + cheek tufts -->
    <path fill="#121217" stroke="#ffd400" stroke-width="2.2" paint-order="stroke"
      d="M10 34 C10 27 11.5 21 13.5 16.5 L12.5 5.5 L25.5 16.8 C29 15.6 35 15.6 38.5 16.8 L51.5 5.5 L50.5 16.5 C52.5 21 54 27 54 34 C54 38 55.5 40.8 58 42.6 L53.6 43.6 L55.6 47 L50.4 46.8 C46.5 52.8 39.6 56 32 56 C24.4 56 17.5 52.8 13.6 46.8 L8.4 47 L10.4 43.6 L6 42.6 C8.5 40.8 10 38 10 34 Z" />
    <!-- inner ears -->
    <path fill="#ff8f7a" d="M15 9.6 L23.8 18 C20.4 18.8 17.6 20.8 15.6 23.2 C15.2 18.6 15 14 15 9.6 Z" />
    <path fill="#ff8f7a" d="M49 9.6 L40.2 18 C43.6 18.8 46.4 20.8 48.4 23.2 C48.8 18.6 49 14 49 9.6 Z" />
    <!-- forehead fur tufts -->
    <g stroke="#2c2c36" stroke-width="1.1" fill="none">
      <path d="M29 21 L30.5 25" /><path d="M32 20.5 L32 25" /><path d="M35 21 L33.5 25" />
    </g>
    <!-- eyes -->
    <g>
      <ellipse cx="22.5" cy="36" rx="6.6" ry="7.6" fill="#ffd400" />
      <ellipse cx="23.2" cy="36.6" rx="2.3" ry="5.6" fill="#0a0a0d" />
      <circle cx="20.6" cy="32.8" r="2.1" fill="#fff" />
      <circle cx="25.4" cy="39.8" r="0.95" fill="#fff" />
      <path d="M15.4 31.6 C18.4 27.6 25.6 28.4 30.2 33.6" stroke="#0a0a0d" stroke-width="2" fill="none" />

      <ellipse cx="41.5" cy="36" rx="6.6" ry="7.6" fill="#ffd400" />
      <ellipse cx="40.8" cy="36.6" rx="2.3" ry="5.6" fill="#0a0a0d" />
      <circle cx="38.9" cy="32.8" r="2.1" fill="#fff" />
      <circle cx="43.6" cy="39.8" r="0.95" fill="#fff" />
      <path d="M48.6 31.6 C45.6 27.6 38.4 28.4 33.8 33.6" stroke="#0a0a0d" stroke-width="2" fill="none" />
    </g>
    <!-- blush -->
    <ellipse cx="15.6" cy="45.4" rx="2.6" ry="1.3" fill="#ff8f7a" opacity="0.35" />
    <ellipse cx="48.4" cy="45.4" rx="2.6" ry="1.3" fill="#ff8f7a" opacity="0.35" />
    <!-- whiskers, drawn over the cheek so they read as rooted in it -->
    <g stroke="#e4e4ea" stroke-width="0.9" fill="none">
      <path d="M19 44 L2.5 40.5" /><path d="M19 46.4 L3.5 48.6" />
      <path d="M45 44 L61.5 40.5" /><path d="M45 46.4 L60.5 48.6" />
    </g>
    <!-- nose + mouth -->
    <path fill="#ff9aa8" d="M30.2 43.6 L33.8 43.6 L32 45.8 Z" />
    <path d="M28.8 47 Q30.4 48.8 32 46.6 Q33.6 48.8 35.2 47" stroke="#b9b9c6" stroke-width="1" fill="none" />
  </g>
</svg>
