<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TelemetryLab">
  <!-- A timing table reduced to its smallest legible form: three rows of
       decreasing width on the app's own near-black paper. Same mark as the
       wordmark in the nav, which is drawn in CSS. -->
  <rect width="32" height="32" rx="7" fill="#0a0d12" />
  <rect x="7" y="10" width="18" height="3" rx="1.5" fill="#5b93ec" />
  <rect x="7" y="15" width="12" height="3" rx="1.5" fill="#3ddc84" />
  <rect x="7" y="20" width="16" height="3" rx="1.5" fill="#5b93ec" opacity="0.5" />
</svg>
