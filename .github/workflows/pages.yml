name: pages

# Publishes site/ — the marketing page — to GitHub Pages at telemetrylab.app.
# The folder has no build step (see site/README.md), so this uploads it as-is;
# site/CNAME is what binds the custom domain, and it must stay in the artifact.

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write # publish to the Pages endpoint
  id-token: write # OIDC token the deploy action exchanges for it

# One deploy at a time. Unlike ci.yml this does not cancel in progress: a
# half-finished deploy would leave the live site mid-swap, so a superseded run
# is allowed to finish and the next one follows it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy site/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
