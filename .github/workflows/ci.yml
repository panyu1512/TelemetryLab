name: ci

# Quality gates for every change: the fast, cross-platform feedback loop that
# must stay green before anything merges.

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Python bridge: lint, format check, and the unit + integration suite.
  # ---------------------------------------------------------------------------
  bridge:
    name: bridge (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: bridge/requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest (with coverage gate)
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload bridge coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-coverage
          path: bridge/coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Frontend: type-check, unit tests with coverage, and a production build.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (with coverage gate)
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # A single required status that both matrices roll up into, so branch
  # protection can gate on one check regardless of how many jobs run.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: ci
    runs-on: ubuntu-latest
    needs: [bridge, frontend]
    if: always()
    steps:
      - name: Verify all gates passed
        run: |
          if [ "${{ needs.bridge.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "One or more quality gates failed."
            exit 1
          fi
          echo "All quality gates passed."
