name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the .msi as a release asset

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Build the Python sidecar (onefile exe) with PyInstaller.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build bridge sidecar
        working-directory: bridge
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pyinstaller bridge.spec

      # 2. Place the sidecar where Tauri expects it, with the target-triple name.
      - name: Stage sidecar for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item bridge/dist/iracing-bridge.exe `
            src-tauri/binaries/iracing-bridge-x86_64-pc-windows-msvc.exe -Force

      # 3. Frontend toolchain.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install

      # 4. Rust toolchain (+ cache).
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # 5. Build the Tauri app (produces the .msi installer).
      - name: Tauri build
        run: npm run tauri build

      # 6. Upload the installer as a workflow artifact...
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: iracing-telemetry-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # ...and as a GitHub Release asset when triggered by a version tag.
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/msi/*.msi
