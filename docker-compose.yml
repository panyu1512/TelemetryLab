# One-command development environment.
#
#   docker compose up --build
#   → open http://localhost:1420
#
# What this is: the macOS/Linux "browser + mock bridge" workflow, containerized.
# - bridge-mock: serves synthetic telemetry on ws://localhost:8765
# - web:         runs the Vite dev server (React app) on http://localhost:1420
#
# What this is NOT: the Tauri desktop app. Tauri is a native Windows/macOS
# binary and the real bridge needs iRacing's Windows shared memory — neither
# runs in a Linux container. Those are built by CI (.github/workflows/build.yml).
#
# The React app runs in your *host* browser, so it connects to the bridge via
# the published port (localhost:8765), not over the internal compose network.

services:
  bridge-mock:
    build:
      context: ./bridge
    image: iracing-telemetry-bridge-mock
    container_name: iracing-bridge-mock
    ports:
      - "8765:8765"
    environment:
      # >0 = simulate iRacing connecting/disconnecting every N seconds.
      MOCK_DISCONNECT_EVERY: "0"
    restart: unless-stopped

  web:
    image: node:20-bookworm-slim
    container_name: iracing-web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "1420:1420"
    environment:
      # The host browser reaches the bridge through its published port.
      VITE_WS_HOST: "localhost"
      VITE_WS_PORT: "8765"
      # File watching over bind mounts is unreliable on Docker Desktop (macOS);
      # polling makes HMR reliable. Drop it if your CPU usage is high.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Live source for hot reload...
      - ./:/app
      # ...but keep the container's own (linux) node_modules.
      - /app/node_modules
    depends_on:
      - bridge-mock
