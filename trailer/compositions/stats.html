  <div id="root" data-composition-id="stats" data-width="1920" data-height="1080">

  <script>
    {
      const root = document.querySelector('[data-composition-id="stats"]');
      window.TL.localise(root);
      const tl = gsap.timeline({ paused: true });

      const words = window.TL.words(root.querySelector("#sts-h"));
      tl.fromTo(words[0], { opacity: 0, filter: "blur(14px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, 0);
      tl.fromTo(words.slice(1), { opacity: 0, filter: "blur(14px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.05 }, 0.25);

      tl.fromTo("#sts-strip", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 0.1);
      root.querySelectorAll(".sts-v").forEach((value, i) => {
        tl.fromTo(value, { opacity: 0, filter: "blur(10px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, 0.25 + i * 0.25);
      });

      tl.to("#root > *", { opacity: 0, filter: "blur(12px)", duration: 0.2, ease: "power2.in" }, 1.8);
      window.__timelines["stats"] = tl;
    }
  </script>
