  <script>
    {
      const root = document.querySelector('[data-composition-id="cuts"]');
      window.TL.localise(root);

      const tl = gsap.timeline({ paused: true });

      // A crop box is only there while its footage is: hard on, hard off.
      const shots = [[1, 0, 0.5], [2, 0.5, 1], [3, 1, 1.5], [4, 1.5, 2], [5, 2, 2.5], [6, 2.5, 3], [7, 3, 3.5]];

        tl.set(`#cut-c${n}`, { opacity: 1 }, on);
        tl.set(`#cut-c${n}`, { opacity: 0 }, off);
        // Each lands a little large and settles inside its half-second.
        if (n < 7) {
          tl.fromTo(`#cut-c${n}`, { scale: 1.06 }, { scale: 1, duration: 0.4, ease: "expo.out" }, on);
        }
      }
      tl.set({}, {}, 4);
      window.__timelines["cuts"] = tl;
