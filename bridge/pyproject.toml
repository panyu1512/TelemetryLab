[project]
name = "telemetrylab-bridge"
version = "0.1.0"
description = "iRacing telemetry bridge — source-agnostic core, real (irsdk) and mock sources."
requires-python = ">=3.11"

# Runtime deps live in requirements.txt / requirements-mock.txt so the CI and
# PyInstaller flows stay simple; this table exists so the package is importable
# and tooling (ruff, pytest) has a project root to anchor on.

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "unit: fast, isolated unit tests (the default)",
]

[tool.coverage.run]
branch = true
source = ["telemetrylab"]
omit = [
    "tests/*",
    # Thin I/O shells exercised end-to-end, not unit-tested:
    "telemetrylab/publisher.py",
    # Network/threaded static server — verified by an integration test
    # (test_http_server.py) rather than the unit-coverage gate.
    "telemetrylab/http_server.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# The pure-logic core is what we gate on; the async orchestration and I/O
# shells are covered by integration/smoke, not this unit-coverage number.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",    # line length is handled by the formatter, not linting
    "B008",    # function calls in argument defaults (used intentionally in tests)
    "SIM102",  # nested ifs are kept where an interleaved comment explains each guard
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]  # "useless expression" — asserts on attribute access in tests

[tool.ruff.lint.isort]
known-first-party = ["telemetrylab"]
